# ============================================================
# 本地数据质量校验流水线配置
# ============================================================
spring.application.name=data-quality-pipeline

# 单批次最大记录数（硬上限），超过按 pipeline.overflow-strategy 处理
pipeline.max-records-per-batch=1000000
# 同时在执行的批次数（信号量边界），超出排队等待
pipeline.max-concurrent-batches=4
# 生产者/消费者之间有界队列容量，满时背压
pipeline.record-queue-capacity=1024
# 入队最长等待毫秒，超时按容量策略拒绝
pipeline.offer-timeout-millis=5000
# 批次内 UNIQUE 不同值的总槽位上限
pipeline.unique-tracker-capacity=1000000
# 达到容量上限的策略：REJECT（拒绝批次）或 ISOLATE（截断并隔离，基线不更新）
pipeline.overflow-strategy=REJECT
# 失败记录占比严格大于该阈值时批次被拒绝；1.0 表示永不按比例拒绝
pipeline.max-reject-ratio=1.0
# 记录主键字段（隔离/重放定位），缺失时使用序号
pipeline.key-field=id
# 参与基线统计与漂移检查的字段，逗号分隔，留空表示不启用基线
pipeline.baseline-fields=
# 漂移阈值：均值偏离历史标准差的倍数；缺失率允许的绝对偏差
pipeline.drift-z-threshold=3.0
pipeline.null-ratio-delta=0.1
# 基线存储：file（默认，重启累积）或 memory（演示/测试）
pipeline.baseline-store=file
pipeline.storage-path=data/pipeline

# 日志：包含批次、规则与拒绝/隔离原因（见 logback 配置）
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
