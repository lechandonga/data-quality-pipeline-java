# 本地数据质量校验流水线配置
spring.application.name=data-quality-pipeline

# ---- 容量与并发边界 ----
# 单批次行规则并行评估的工作线程数
dqp.worker-threads=4
# 同时在执行的批次数上限（超出直接拒绝，HTTP 429）
dqp.max-concurrent-batches=8
# 单批次在途记录队列上限；达到后按 overflow-policy 隔离或拒绝
dqp.queue-capacity=10000
# 唯一键集合/字段基数的条目上限，防止超大输入无界占用内存
dqp.distinct-capacity=1000000
# 达到容量上限时的策略：ISOLATE（隔离记录并记录原因）或 REJECT（整批拒绝）
dqp.overflow-policy=ISOLATE

# ---- 基线漂移阈值 ----
# 均值漂移：|batchMean - baseMean| / baseStd 超过该值（z-score）判漂移
dqp.mean-shift-threshold=3.0
# 缺失率漂移：|batchNullRate - baseNullRate| 超过该绝对差判漂移
dqp.std-shift-threshold=0.3

# ---- 基线持久化 ----
# 留空=仅内存基线（重启丢失）；配置目录后使用临时文件+原子move的文件基线
# dqp.baseline-dir=./.dqp-baselines
